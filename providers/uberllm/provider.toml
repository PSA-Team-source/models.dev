# UberLLM is an API marketplace: each request is sent to a third-party inference provider that serves the
# requested model, and costs what that provider charged; UberLLM adds no fee on requests.
# OpenAI POST /v1/chat/completions (this file's default API) and Anthropic POST /v1/messages on the same key.
# Reasoning controls depend on the provider that serves a request, so each model file lists only the controls
# that were measured to work on this host, with the probe results in its header (2026-10-30).
name = "UberLLM"
env = ["UBERLLM_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.uberllm.dev/v1"
doc = "https://uberllm.dev/docs"
