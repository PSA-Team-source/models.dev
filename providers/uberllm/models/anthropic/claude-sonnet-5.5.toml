# Model id, prices and limits: UberLLM's catalog, GET https://api.uberllm.dev/v1/models (2026-10-30).
# Prices are the listed price: it follows the market and is refreshed every 5 minutes; a call is billed what the serving provider charged.
# Reasoning: no reasoning came back on this host for reasoning_effort (low|high|none), reasoning.effort, reasoning.max_tokens,
#   thinking.type=enabled on /v1/chat/completions, or thinking enabled|adaptive on /v1/messages (7 probes), so it is off here.
#   Probed 2026-10-30 on /v1/chat/completions.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = false }

[cost.text.input]
price = 1.42
cache = { read = 0.071 }

[cost.text.output]
price = 7.1
