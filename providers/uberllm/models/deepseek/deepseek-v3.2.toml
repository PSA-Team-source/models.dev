# Model id, prices and limits: UberLLM's catalog, GET https://api.uberllm.dev/v1/models (2026-10-30).
# Prices are the listed price: it follows the market and is refreshed every 5 minutes; a call is billed what the serving provider charged.
# Reasoning: this host serves the non-thinking mode: no reasoning with any reasoning_effort or reasoning.enabled (6 probes).
#   Probed 2026-10-30 on /v1/chat/completions.
schema = 2
base_model = "deepseek/deepseek-v3.2"

[capabilities]
reasoning = { supported = false }

[cost.text.input]
price = 0.0084
cache = { read = 0.00084 }

[cost.text.output]
price = 0.0126
